<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,560;0,9..144,650;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#1B1D22;
    --ink-soft:#3A3D45;
    --paper:#FBF9F5;
    --card:#FFFFFF;
    --slate:#767A85;
    --line:#E7E2D6;
    --brass:#9C7A3C;
    --brass-deep:#7C5F2C;
    --brass-tint:#F1E9D6;
    --danger:#B4483F;
    --danger-deep:#94352D;
    --good:#3F8F5F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    min-height:100vh;
  }

  /* ---------- App shell ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .word{
    font-family:'Fraunces', serif; font-weight:560; font-size:20px; letter-spacing:0.2px;
  }
  .brand .sub{ font-size:12px; color:var(--slate); }
  .topbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .conn-dot{ width:8px; height:8px; border-radius:50%; background:#C9C2AE; display:inline-block; margin-right:4px; }
  .conn-dot.on{ background:var(--good); }
  .btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:14px;
    padding:11px 20px; border-radius:3px; border:1px solid var(--ink);
    background:var(--ink); color:var(--paper);
    cursor:pointer; transition:background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .btn:hover{ background:#000; }
  .btn:active{ transform:translateY(1px); }
  .btn[disabled]{ opacity:0.55; cursor:progress; }
  .btn.ghost{
    background:transparent; color:var(--ink); border:1px solid var(--line);
  }
  .btn.ghost:hover{ border-color:var(--ink); background:transparent; }
  .btn.danger{
    background:var(--danger); border-color:var(--danger); color:#fff;
  }
  .btn.danger:hover{ background:var(--danger-deep); border-color:var(--danger-deep); }

  .banner{
    background:var(--brass-tint); color:var(--brass-deep); font-size:13px;
    padding:10px 28px; border-bottom:1px solid var(--line);
  }

  .layout{
    display:grid;
    grid-template-columns: minmax(320px, 420px) 1fr;
    gap:0;
    align-items:start;
  }
  @media (max-width: 940px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ---------- Form column ---------- */
  .form-col{
    padding:28px; border-right:1px solid var(--line);
    max-height:calc(100vh - 65px); overflow-y:auto;
  }
  @media (max-width: 940px){ .form-col{ max-height:none; border-right:none; border-bottom:1px solid var(--line);} }

  .section{ margin-bottom:30px; }
  .section h2{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--brass-deep);
    margin:0 0 14px 0; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  details.collapsible summary{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--brass-deep);
    margin:0 0 14px 0; padding-bottom:8px; border-bottom:1px solid var(--line);
    cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between;
  }
  details.collapsible summary::-webkit-details-marker{ display:none; }
  details.collapsible summary::after{
    content:'+'; font-size:15px; color:var(--slate); font-weight:400;
  }
  details.collapsible[open] summary::after{ content:'\2212'; }
  details.collapsible summary:hover{ color:var(--ink); }
  details.collapsible[open] summary{ margin-bottom:14px; }
  details.collapsible .field:first-of-type{ margin-top:2px; }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:12px; color:var(--slate); margin-bottom:5px; font-weight:500;
  }
  .field input, .field textarea, .field select{
    width:100%; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
    padding:9px 11px; border:1px solid var(--line); border-radius:3px;
    background:var(--card); outline:none; transition:border-color .12s ease;
  }
  .field textarea{ resize:vertical; line-height:1.5; }
  .field select{ cursor:pointer; }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--brass); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .item-row{
    display:grid; grid-template-columns:1fr 100px 28px; gap:8px; align-items:center; margin-bottom:8px;
  }
  .item-row input{ padding:8px 10px; font-size:13px; }
  .icon-btn{
    width:28px; height:28px; border-radius:3px; border:1px solid var(--line); background:var(--card);
    color:var(--slate); cursor:pointer; font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .icon-btn:hover{ border-color:var(--danger); color:var(--danger); }
  .add-item{
    font-size:13px; font-weight:600; color:var(--brass-deep); background:none; border:none;
    cursor:pointer; padding:6px 0; display:inline-flex; align-items:center; gap:6px;
  }
  .add-item:hover{ text-decoration:underline; }

  .sig-preview-wrap{ display:none; align-items:center; gap:10px; margin-top:8px; }
  .sig-preview-wrap img{ max-height:48px; max-width:200px; border:1px solid var(--line); border-radius:3px; background:#fff; padding:4px; }
  .sig-sliders{ display:none; margin-top:14px; }
  .sig-sliders .slider-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .sig-sliders .slider-row label{ font-size:12px; color:var(--slate); width:82px; flex-shrink:0; margin-bottom:0; }
  .sig-sliders input[type=range]{ flex:1; accent-color:var(--brass); }
  .sig-sliders .slider-val{ font-size:12px; color:var(--ink-soft); width:38px; text-align:right; flex-shrink:0; }

  /* ---------- Preview column ---------- */
  .preview-col{
    padding:40px; display:flex; justify-content:center; overflow-x:auto;
    background:
      radial-gradient(circle at 1px 1px, #00000009 1px, transparent 0) 0 0/16px 16px;
  }
  #page-outer{ animation: rise .5s ease both; flex-shrink:0; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  #invoice-page{
    width:816px; min-height:1056px;
    background:var(--card);
    box-shadow:0 1px 3px rgba(0,0,0,.08), 0 12px 40px rgba(20,15,5,.10);
    padding:64px 60px 56px 60px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }

  .inv-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
  .inv-word{
    font-family:'Fraunces', serif; font-weight:650; font-size:42px; letter-spacing:0.2px; line-height:1;
  }
  .inv-tagline{ margin-top:8px; font-size:13px; color:var(--slate); }
  .meta-stamp{
    background:var(--brass-tint); padding:14px 20px; min-width:190px;
    border-left:2px solid var(--brass);
  }
  .meta-row{ display:flex; justify-content:space-between; gap:16px; padding:3px 0; }
  .meta-row + .meta-row{ margin-top:2px; }
  .meta-label{ font-size:11.5px; color:var(--brass-deep); }
  .meta-value{ font-size:12.5px; font-weight:600; color:var(--ink); }

  .rule{ height:1px; background:var(--ink); opacity:0.9; margin:26px 0 28px 0; }

  .parties{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:34px; }
  .party-label{ font-size:12px; color:var(--slate); margin-bottom:6px; }
  .party-name{ font-size:16px; font-weight:600; margin-bottom:4px; }
  .party-line{ font-size:13px; color:var(--ink-soft); line-height:1.55; }

  table.items{ width:100%; border-collapse:collapse; margin-bottom:2px; }
  table.items thead th{
    text-align:left; font-size:11.5px; font-weight:600; color:var(--slate);
    border-bottom:1px solid var(--ink); padding:0 0 9px 0;
  }
  table.items thead th.amt{ text-align:right; }
  table.items tbody td{
    font-size:14px; padding:13px 0; border-bottom:1px solid var(--line); vertical-align:top;
  }
  table.items tbody td.amt{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.items tbody td.desc-empty{ color:var(--slate); font-style:italic; }

  .total-row{ display:flex; justify-content:flex-end; align-items:baseline; gap:22px; padding:16px 0 0 0; border-top:2px solid var(--brass); margin-top:2px; }
  .total-label{ font-size:14px; font-weight:600; color:var(--ink-soft); }
  .total-value{ font-family:'Fraunces', serif; font-weight:650; font-size:26px; color:var(--brass-deep); font-variant-numeric:tabular-nums; }

  .pay-section{ margin-top:42px; }
  .pay-title{ font-size:12px; color:var(--slate); margin-bottom:12px; }
  .pay-grid{ display:grid; grid-template-columns:1fr 1fr; column-gap:26px; }
  .pay-item{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .pay-item .k{ color:var(--slate); }
  .pay-item .v{ font-weight:600; }
  .pay-note{
    grid-column:1 / -1; font-size:11.5px; color:var(--slate); font-style:italic;
    padding:7px 2px 2px 2px; text-align:right;
  }
  .pay-note b{ color:var(--brass-deep); font-style:normal; font-weight:600; }

  .sign-section{ margin-top:52px; display:flex; justify-content:flex-end; }
  .sign-block{ text-align:right; min-width:220px; }
  .sign-image-wrap{ display:none; margin-bottom:6px; text-align:right; }
  .sign-image-wrap img{ display:inline-block; height:auto; }
  .sign-name{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:26px; margin-bottom:6px; }
  .sign-rule{ border-top:1px solid var(--ink); margin-bottom:6px; }
  .sign-caption{ font-size:11px; color:var(--slate); }

  /* ---------- Modals ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,17,10,.35); z-index:50;
    display:flex; align-items:center; justify-content:center;
  }
  .modal{
    background:var(--card); width:580px; max-width:92vw; max-height:78vh;
    border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.25); display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line);
  }
  .modal-head h3{ margin:0; font-family:'Fraunces',serif; font-weight:560; font-size:18px; }
  .modal-filter{
    display:flex; align-items:center; gap:10px; padding:12px 20px;
    border-bottom:1px solid var(--line); font-size:13px; color:var(--slate);
  }
  .modal-filter select, .modal-filter input{
    padding:7px 9px; border:1px solid var(--line); border-radius:3px;
    font-family:'Inter',sans-serif; font-size:13px; color:var(--ink); background:var(--card); outline:none;
  }
  .modal-filter select{ flex:1; cursor:pointer; }
  .modal-filter input{ flex:1.2; }
  .modal-filter select:focus, .modal-filter input:focus{ border-color:var(--brass); }
  .history-list{ overflow-y:auto; padding:8px 12px; }
  .hist-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:12px 10px; border-bottom:1px solid var(--line);
    cursor:pointer; border-radius:3px;
  }
  .hist-row:hover{ background:var(--paper); }
  .hist-main{ flex:1; min-width:0; }
  .hist-title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-sub{ font-size:12px; color:var(--slate); margin-top:2px; }
  .hist-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .hist-amt{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--brass-deep); white-space:nowrap; }
  .hist-del-btn{
    width:28px; height:28px; border-radius:3px; border:1px solid transparent; background:transparent;
    color:var(--slate); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .hist-del-btn:hover{ border-color:var(--danger); color:var(--danger); background:#fff; }
  .hist-empty{ padding:34px 10px; text-align:center; color:var(--slate); font-size:13px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:4px; font-size:13px;
    opacity:0; transition:opacity .2s ease, transform .2s ease; z-index:60; display:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#D8D2C2; border-radius:5px; }

  /* ---------- Print / Save as PDF ---------- */
  @page { size: Letter; margin: 0; }
  @media print {
    html, body { background:#fff !important; min-height:0 !important; }
    *, *::before, *::after {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .topbar, .banner, .form-col, .overlay, .toast { display:none !important; }
    .layout { display:block !important; }
    .preview-col { display:block !important; padding:0 !important; background:none !important; overflow:visible !important; }
    #page-outer { animation:none !important; transform:none !important; }
    #invoice-page {
      width:8.5in !important; min-height:0 !important; margin:0 !important;
      box-shadow:none !important;
    }
    table.items tr, .pay-item, .sign-section { break-inside:avoid; page-break-inside:avoid; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="word">Invoice Studio</div>
    <div class="sub">Fill in the details, then export a polished PDF</div>
  </div>
  <div class="topbar-actions">
    <span id="connStatus" class="conn-dot"></span>
    <button class="btn ghost" id="signOutBtn" style="display:none;">Sign out</button>
    <button class="btn ghost" id="newInvoiceBtn">New</button>
    <button class="btn ghost" id="historyBtn">History</button>
    <button class="btn ghost" id="saveInvoiceBtn">Save invoice</button>
    <button class="btn" id="downloadBtn">Download PDF</button>
  </div>
</div>

<div class="banner" id="configBanner" style="display:none;">
  Not connected to Supabase yet — add your project URL and anon key near the top of the <script> block (look for <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code>) to enable saved clients, profiles, and invoice history. PDF export still works without it.
</div>

<div class="layout">
  <!-- FORM -->
  <div class="form-col">

    <div class="section">
      <h2>Your profile</h2>
      <div class="field">
        <label>Signing as</label>
        <select id="profileSelect"><option value="">Not connected</option></select>
      </div>
      <button class="add-item" id="saveProfileBtn">Save current info to this profile</button>
    </div>

    <details class="section collapsible" id="detailsFrom">
      <summary>From</summary>
      <div class="field"><label>Your name / business</label><input id="fromName" placeholder="Your name or business"></div>
      <div class="field"><label>Street address</label><input id="fromStreet" placeholder="Street address"></div>
      <div class="row2">
        <div class="field"><label>City, State ZIP</label><input id="fromCityState" placeholder="City, ST ZIP"></div>
        <div class="field"><label>Phone</label><input id="fromPhone" placeholder="Phone number"></div>
      </div>
      <div class="field"><label>Email</label><input id="fromEmail" placeholder="Email address"></div>
    </details>

    <div class="section">
      <h2>Bill to</h2>
      <div class="field">
        <label>Client name</label>
        <select id="toName">
          <option value="">Select a client…</option>
          <option value="__new__">+ New client…</option>
        </select>
      </div>
      <div class="field" id="toNameCustomWrap" style="display:none;">
        <label>New client name</label>
        <input id="toNameCustom" placeholder="Enter client name">
      </div>
      <div class="field"><label>Additional info (optional)</label><textarea id="toNote" rows="3" placeholder="Address, account #, attn line, etc. — one item per line"></textarea></div>
    </div>

    <div class="section">
      <h2>Invoice details</h2>
      <div class="row2">
        <div class="field"><label>Invoice number</label><input id="invNo" placeholder="e.g. 1"></div>
        <div class="field"><label>Date</label><input id="invDate" type="date"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Terms</label>
          <select id="invTerms">
            <option value="NET 30" selected>NET 30</option>
            <option value="NET 15">NET 15</option>
            <option value="NET 14">NET 14</option>
            <option value="Due upon receipt">Due upon receipt</option>
            <option value="__custom__">Custom…</option>
          </select>
          <input id="invTermsCustom" placeholder="Enter custom terms" style="margin-top:8px; display:none;">
        </div>
        <div class="field">
          <label>Invoice currency</label>
          <select id="invCurrency">
            <option value="USD" selected>USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Brand / project (for filename only)</label><input id="invBrand" placeholder="e.g. Proof"></div>
    </div>

    <div class="section">
      <h2>Line items</h2>
      <div id="itemsWrap"></div>
      <button class="add-item" id="addItemBtn">+ Add line item</button>
    </div>

    <details class="section collapsible" id="detailsPayment">
      <summary>Payment information</summary>
      <div class="field">
        <label>Banking profile</label>
        <select id="bankingProfileSelect">
          <option value="">Select banking profile…</option>
          <option value="__new__">+ New banking profile…</option>
        </select>
      </div>
      <div class="row2">
        <div class="field"><label>Account name</label><input id="payAcctName" placeholder="Account holder name"></div>
        <div class="field"><label>Account no.</label><input id="payAcctNo" placeholder="Account number"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Bank name</label><input id="payBankName" placeholder="Bank name"></div>
        <div class="field"><label>Routing no.</label><input id="payRouting" placeholder="Routing number"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Bank currency</label><input id="payCurrency" value="USD"></div>
        <div class="field"><label>PayPal email</label><input id="payPaypal" placeholder="PayPal email"></div>
      </div>
      <div class="field">
        <label>PayPal fee note</label>
        <select id="paypalFeeOption">
          <option value="none">Don't include</option>
          <option value="3" selected>Include — 3% fee</option>
          <option value="5">Include — 5% fee</option>
        </select>
      </div>
      <button type="button" class="add-item" id="saveBankingProfileBtn">Save banking profile</button>
    </details>

    <details class="section collapsible" id="detailsSignature">
      <summary>Signature</summary>
      <div class="row2">
        <div class="field"><label>Signed by</label><input id="signName" placeholder="Signer name"></div>
        <div class="field"><label>Date signed</label><input id="signDate" type="date"></div>
      </div>
      <div class="field">
        <label>Signature image (optional)</label>
        <input type="file" id="sigFile" accept="image/*">
      </div>
      <div class="sig-preview-wrap" id="sigPreviewWrap">
        <img id="sigPreviewImg" alt="Signature preview">
        <button class="icon-btn" id="sigRemoveBtn" title="Remove">×</button>
      </div>
      <div class="sig-sliders" id="sigSliders">
        <div class="slider-row">
          <label>Size</label>
          <input type="range" id="sigScale" min="50" max="200" value="100">
          <span class="slider-val" id="sigScaleVal">100%</span>
        </div>
        <div class="slider-row">
          <label>Spacing</label>
          <input type="range" id="sigSpacing" min="0" max="40" value="6">
          <span class="slider-val" id="sigSpacingVal">6px</span>
        </div>
      </div>
    </details>

  </div>

  <!-- PREVIEW -->
  <div class="preview-col">
    <div id="page-outer">
      <div id="invoice-page">
        <div class="inv-header">
          <div>
            <div class="inv-word">Invoice</div>
            <div class="inv-tagline" id="pv-fromName"></div>
          </div>
          <div class="meta-stamp" id="pv-metaStamp">
            <div class="meta-row" id="pv-invNoRow"><span class="meta-label">Invoice no.</span><span class="meta-value" id="pv-invNo"></span></div>
            <div class="meta-row" id="pv-invDateRow"><span class="meta-label">Date</span><span class="meta-value" id="pv-invDate"></span></div>
            <div class="meta-row" id="pv-invTermsRow"><span class="meta-label">Terms</span><span class="meta-value" id="pv-invTerms"></span></div>
          </div>
        </div>

        <div class="rule"></div>

        <div class="parties">
          <div>
            <div class="party-label">From</div>
            <div class="party-name" id="pv-fromName2"></div>
            <div class="party-line" id="pv-fromAddr"></div>
            <div class="party-line" id="pv-fromContact"></div>
          </div>
          <div>
            <div class="party-label">Bill to</div>
            <div class="party-name" id="pv-toName"></div>
            <div class="party-line" id="pv-toNote"></div>
          </div>
        </div>

        <table class="items">
          <thead>
            <tr><th>Description</th><th class="amt">Amount</th></tr>
          </thead>

function describeError(err){
  if(!err) return 'Unknown error';
  if(typeof err === 'string') return err;
  if(err.message) return err.message + (err.hint ? ` (${err.hint})` : '');
  try{ return JSON.stringify(err); } catch(e){ return String(err); }

const CURRENCY_SYMBOLS = { USD: '$', EUR: '€', GBP: '£' };
function fmtMoney(n, currency){
  const v = isFinite(n) ? n : 0;
  const code = currency || 'USD';
  const symbol = CURRENCY_SYMBOLS[code] || (code + ' ');
  return symbol + v.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function escapeAttr(s){ return String(s).replace(/"/g,'"'); }
function escapeHtml(s){ return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => { t.style.display = 'none'; }, 250);
  }, 2400);
}

  const wrap = document.getElementById('itemsWrap');

      <button class="icon-btn" data-remove="${i}" title="Remove">×</button>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', (e) => {
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.field;
      items[idx][field] = field === 'amt' ? parseFloat(e.target.value || 0) : e.target.value;
      state.isDirty = true;
      updatePreview();
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = +e.target.dataset.remove;
      items.splice(idx, 1);
      state.isDirty = true;
      renderItemRows();
      updatePreview();
    });
  });
}

document.getElementById('sigFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/png');
      state.signatureImage = dataUrl;
      state.sigScale = 100;
      state.sigSpacing = 6;
      syncSignatureSliderInputs();
      setSignaturePreview(dataUrl);
      updatePreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

  if(items.length === 0){
    body.innerHTML = `<tr><td class="desc-empty">No line items yet</td><td class="amt">—</td></tr>`;
  } else {
    items.forEach(item => {
      total += (parseFloat(item.amt) || 0);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${escapeHtml(item.desc || '')}</td><td class="amt">${fmtMoney(item.amt || 0, invCurrency)}</td>`;

  }
  document.getElementById('pv-total').textContent = fmtMoney(total, invCurrency);

  } else {
    const feePct = parseFloat(feeOption);

  document.getElementById('pv-acctName').textContent = val('payAcctName');
  document.getElementById('pv-bankName').textContent = val('payBankName');
  document.getElementById('pv-acctNo').textContent = val('payAcctNo');
  document.getElementById('pv-routing').textContent = val('payRouting');
  document.getElementById('pv-currency').textContent = val('payCurrency') || 'USD';
  document.getElementById('pv-paypal').textContent = val('payPaypal');

  document.getElementById('pv-signDate').textContent = fmtDate(val('signDate'));
  updateSignatureBlock();
}

/* =========================================================
   Banking Profiles (Auto-match / overwrite by routing + acct_no)
   ========================================================= */
function formatBankingProfileLabel(bp){
  const bank = (bp.bank_name || '').trim();
  const acctNo = (bp.acct_no || '').trim();
  const acctName = (bp.acct_name || '').trim();
  const tail = acctNo ? `••${acctNo.slice(-4)}` : '';
  const main = [bank, tail].filter(Boolean).join(' ') || (bp.label || 'Bank account');
  return acctName ? `${main} (${acctName})` : main;
}

function renderBankingProfileList(){
  const sel = document.getElementById('bankingProfileSelect');
  const prevValue = sel.value;
  sel.innerHTML = '';

  const optDefault = document.createElement('option');
  optDefault.value = '';
  optDefault.textContent = bankingProfilesCache.length ? 'Select banking profile…' : 'No saved banking profiles';
  sel.appendChild(optDefault);

  bankingProfilesCache.forEach(bp => {
    const opt = document.createElement('option');
    opt.value = bp.id;
    opt.textContent = formatBankingProfileLabel(bp);
    sel.appendChild(opt);
  });

  const optNew = document.createElement('option');
  optNew.value = '__new__';
  optNew.textContent = '+ New banking profile…';
  sel.appendChild(optNew);

  if(prevValue && [...sel.options].some(o => o.value === prevValue)){
    sel.value = prevValue;
  }
}

function syncBankingSelectToCurrentFields(){
  const routing = val('payRouting').trim();
  const acctNo = val('payAcctNo').trim();
  const sel = document.getElementById('bankingProfileSelect');
  if(!routing && !acctNo){
    if(sel.value !== '__new__') sel.value = '';
    return;
  }
  const match = bankingProfilesCache.find(bp =>
    (bp.routing || '').trim() === routing && (bp.acct_no || '').trim() === acctNo
  );
  sel.value = match ? match.id : '';
}

function applyBankingProfile(bp){
  if(!bp) return;
  document.getElementById('payAcctName').value = bp.acct_name || '';
  document.getElementById('payAcctNo').value = bp.acct_no || '';
  document.getElementById('payBankName').value = bp.bank_name || '';
  document.getElementById('payRouting').value = bp.routing || '';
  document.getElementById('payCurrency').value = bp.currency || 'USD';
  document.getElementById('payPaypal').value = bp.paypal || '';
  document.getElementById('paypalFeeOption').value = bp.paypal_fee_option || 'none';
  document.getElementById('bankingProfileSelect').value = bp.id;
  updatePreview();
}

async function loadBankingProfiles(){
  if(!supa){ bankingProfilesCache = []; renderBankingProfileList(); return; }
  try{
    const { data, error } = await supa
      .from('banking_profiles')
      .select('*')
      .order('created_at', { ascending: true });
    if(error) throw error;
    bankingProfilesCache = data || [];
    renderBankingProfileList();
    syncBankingSelectToCurrentFields();
  } catch(err){
    console.warn('[Invoice Studio] Could not load banking_profiles (ensure table exists):', describeError(err));
    bankingProfilesCache = [];
    renderBankingProfileList();
  }
}

document.getElementById('bankingProfileSelect').addEventListener('change', (e) => {
  const value = e.target.value;
  if(value === '__new__'){
    document.getElementById('payAcctName').value = '';
    document.getElementById('payAcctNo').value = '';
    document.getElementById('payBankName').value = '';
    document.getElementById('payRouting').value = '';
    document.getElementById('payCurrency').value = 'USD';
    document.getElementById('payPaypal').value = '';
    document.getElementById('paypalFeeOption').value = '3';
    state.isDirty = true;
    updatePreview();
    document.getElementById('payAcctName').focus();
    return;
  }
  const bp = bankingProfilesCache.find(x => x.id === value);
  if(bp){
    state.isDirty = true;
    applyBankingProfile(bp);
  }
});

async function upsertBankingProfile({ silent = false } = {}){
  if(!supa) return null;
  const routing = val('payRouting').trim();
  const acctNo = val('payAcctNo').trim();
  const acctName = val('payAcctName').trim();
  const bankName = val('payBankName').trim();
  const currency = val('payCurrency').trim() || 'USD';
  const paypal = val('payPaypal').trim();
  const paypalFeeOption = val('paypalFeeOption');

  if(!routing && !acctNo && !bankName && !acctName) return null;

  const autoLabel = [bankName, acctNo ? `••${acctNo.slice(-4)}` : ''].filter(Boolean).join(' ') || acctName || 'Bank account';
  const payload = {
    label: autoLabel,
    acct_name: acctName,
    acct_no: acctNo,
    bank_name: bankName,
    routing: routing,
    currency: currency,
    paypal: paypal,
    paypal_fee_option: paypalFeeOption,
    updated_at: new Date().toISOString()
  };

  try{
    // Match existing banking profile by exact (routing, acct_no) combo when both are present
    let existing = null;
    if(routing && acctNo){
      existing = bankingProfilesCache.find(bp =>
        (bp.routing || '').trim() === routing && (bp.acct_no || '').trim() === acctNo
      );
      if(!existing){
        const { data: foundRows } = await supa
          .from('banking_profiles')
          .select('*')
          .eq('routing', routing)
          .eq('acct_no', acctNo)
          .limit(1);
        if(foundRows && foundRows.length > 0) existing = foundRows[0];
      }
    }

    let savedRow = null;
    let action = 'created';
    if(existing){
      const { data, error } = await supa
        .from('banking_profiles')
        .update(payload)
        .eq('id', existing.id)
        .select()
        .single();
      if(error) throw error;
      savedRow = data;
      action = 'updated';
      const idx = bankingProfilesCache.findIndex(x => x.id === savedRow.id);
      if(idx >= 0) bankingProfilesCache[idx] = savedRow;
      else bankingProfilesCache.push(savedRow);
    } else {
      const { data, error } = await supa
        .from('banking_profiles')
        .insert(payload)
        .select()
        .single();
      if(error) throw error;
      savedRow = data;
      bankingProfilesCache.push(savedRow);
    }

    renderBankingProfileList();
    document.getElementById('bankingProfileSelect').value = savedRow.id;
    if(!silent){

async function suggestNextInvoiceNumberForClient(clientId){
  if(!supa || !clientId) return;
  try{
    let query = supa.from('invoices').select('invoice_no').eq('client_id', clientId);
    if(currentProfile && currentProfile.id){
      query = query.eq('profile_id', currentProfile.id);
    }
    const { data, error } = await query;
    if(error) throw error;
    let maxNum = 0;
    (data || []).forEach(r => {
      const m = String(r.invoice_no || '').trim().match(/^(\d+)$/);
      if(m){
        const n = parseInt(m[1], 10);
        if(n > maxNum) maxNum = n;
      }
    });
    if(!state.invoiceId && !state.invNoManuallyEdited){
      document.getElementById('invNo').value = String(maxNum + 1);
      updatePreview();
    }
  } catch(err){
    console.error('[Invoice Studio] Could not determine next client invoice number:', describeError(err));
  }
}

    if(error) throw error;
    profilesCache = data || [];
    populateProfileSelect(profilesCache);
    if(profilesCache.length === 0){
      setSectionsOpen(true);
    } else {
      const sel = document.getElementById('profileSelect');
      sel.value = profilesCache[0].id;
      currentProfile = profilesCache[0];
      applyProfile(currentProfile);
      setSectionsOpen(false);
    }
  } catch(err){
    console.error('[Invoice Studio] Could not load profiles:', describeError(err));
    setSectionsOpen(true);
  }
}

async function upsertClient(name, note, itemsForClient){
  if(!supa) return null;
  const trimmed = (name || '').trim();
  if(!trimmed) return null;
  try{
    const payload = { name: trimmed, note: (note || '').trim() || null };
    const cleanItems = (itemsForClient || [])
      .map(it => ({ desc: (it.desc || '').trim(), amt: parseFloat(it.amt) || 0 }))
      .filter(it => it.desc !== '' || it.amt !== 0);
    if(cleanItems.length){
      payload.last_items = cleanItems;
    }
    const { data, error } = await supa.from('clients')
      .upsert(payload, { onConflict: 'name' })
      .select().single();
    if(error) throw error;
    return data;
  } catch(err){
    console.error('[Invoice Studio] Could not save client:', describeError(err));
    alert('Could not save client: ' + describeError(err));
    return null;
  }
}

/* =========================================================
   Invoice Persistence
   ========================================================= */
function confirmSaveChoice(invoiceNo){
  return new Promise((resolve) => {
    const overlay = document.getElementById('saveChoiceOverlay');
    const text = document.getElementById('saveChoiceText');
    text.textContent = invoiceNo
      ? `Invoice #${invoiceNo} has already been saved. What would you like to do?`
      : 'This invoice has already been saved. What would you like to do?';
    overlay.style.display = 'flex';

    const overwriteBtn = document.getElementById('saveChoiceOverwrite');
    const newBtn = document.getElementById('saveChoiceNew');
    const cancelBtn = document.getElementById('saveChoiceCancel');

    function cleanup(result){
      overlay.style.display = 'none';
      overwriteBtn.removeEventListener('click', onOverwrite);
      newBtn.removeEventListener('click', onNew);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onBackdrop);
      resolve(result);
    }
    function onOverwrite(){ cleanup('overwrite'); }
    function onNew(){ cleanup('new'); }
    function onCancel(){ cleanup('cancel'); }
    function onBackdrop(e){ if(e.target === overlay) cleanup('cancel'); }

    overwriteBtn.addEventListener('click', onOverwrite);
    newBtn.addEventListener('click', onNew);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onBackdrop);
  });
}

async function persistInvoice(){
  if(!supa) return { ok:false, reason:'not-connected' };

  if(state.invoiceId){
    const choice = await confirmSaveChoice(val('invNo'));
    if(choice === 'cancel') return { ok:false, reason:'cancelled' };
    if(choice === 'new') state.invoiceId = null;
  }
  try{
    // Sync banking profile (updates if routing+acct_no exists, inserts if new)
    if(val('payRouting').trim() && val('payAcctNo').trim()){
      await upsertBankingProfile({ silent: true });
    }

    const client = await upsertClient(getClientNameValue(), val('toNote'), items);
    if(client){
      state.clientId = client.id;
      const idx = clientsCache.findIndex(c => c.id === client.id);
      if(idx >= 0) clientsCache[idx] = client; else clientsCache.push(client);
      renderClientList();
      document.getElementById('toName').value = client.id;
      document.getElementById('toNameCustomWrap').style.display = 'none';
    }
    let total = 0;
    items.forEach(it => total += (parseFloat(it.amt) || 0));
    const payload = {
      invoice_no: val('invNo').trim(),
      invoice_date: val('invDate') || null,
      terms: getTermsValue(),
      profile_id: currentProfile ? currentProfile.id : null,
      client_id: state.clientId,
      items: items,
      currency: val('invCurrency') || 'USD',
      paypal_fee_option: val('paypalFeeOption'),
      total: total,
      sign_name: val('signName'),
      sign_date: val('signDate') || null,
      brand: val('invBrand').trim()
    };
    let result;
    if(state.invoiceId){
      result = await supa.from('invoices').update(payload).eq('id', state.invoiceId).select().single();
    } else {
      result = await supa.from('invoices').insert(payload).select().single();
    }
    if(result.error) throw result.error;
    state.invoiceId = result.data.id;
    state.isDirty = false;
    return { ok:true };
  } catch(err){
    console.error('[Invoice Studio] Could not save invoice:', describeError(err));
    return { ok:false, reason:'error', error: err };
  }
}

document.getElementById('saveInvoiceBtn').addEventListener('click', async () => {
  if(!supa){ alert('Connect Supabase first.'); return; }

  const res = await persistInvoice();

});

function confirmDeleteInvoice(row){
  return new Promise((resolve) => {
    const overlay = document.getElementById('deleteConfirmOverlay');
    const text = document.getElementById('deleteConfirmText');
    const clientName = row.clients ? row.clients.name : 'Unknown client';
    const invLabel = row.invoice_no ? `#${row.invoice_no}` : 'this invoice';
    const amtLabel = fmtMoney(row.total || 0, row.currency || 'USD');
    text.textContent = `Delete invoice ${invLabel} for ${clientName} (${amtLabel})? This cannot be undone.`;

      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onBackdrop);

    }

    function onCancel(){ cleanup(false); }
    function onBackdrop(e){ if(e.target === overlay) cleanup(false); }

    confirmBtn.addEventListener('click', onConfirm);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onBackdrop);
  });
}

async function deleteHistoryInvoice(row){
  if(!supa) return;
  const confirmed = await confirmDeleteInvoice(row);
  if(!confirmed) return;

  try{
    const { data, error } = await supa
      .from('invoices')
      .delete()
      .eq('id', row.id)
      .select();
    if(error) throw error;
    if(!data || data.length === 0){
      alert('Invoice was not deleted. Check that your Supabase RLS policies allow DELETE on the invoices table.');
      return;
    }

    if(state.invoiceId === row.id){
      state.invoiceId = null;
      state.isDirty = true;
    }

    historyCache = historyCache.filter(item => item.id !== row.id);
    renderHistoryRows();
    showToast('Invoice deleted');
  } catch(err){
    console.error('[Invoice Studio] Could not delete invoice:', describeError(err));
    alert('Could not delete invoice: ' + describeError(err));
  }
}

function renderHistoryRows(){
  const listEl = document.getElementById('historyList');
  const term = val('historySearchInput').trim().toLowerCase();
  const filtered = term
    ? historyCache.filter(row => {
        const clientName = (row.clients && row.clients.name) || '';
        const invNo = String(row.invoice_no || '');
        const brand = String(row.brand || '');
        return clientName.toLowerCase().includes(term) ||
               invNo.toLowerCase().includes(term) ||
               brand.toLowerCase().includes(term);
      })
    : historyCache;

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="hist-empty">${historyCache.length ? 'No matching invoices.' : 'No saved invoices yet.'}</div>`;
    return;
  }

  listEl.innerHTML = '';
  filtered.forEach(row => {
    const div = document.createElement('div');
    div.className = 'hist-row';
    const clientName = row.clients ? row.clients.name : '—';
    const profName = row.profiles ? row.profiles.display_name : '—';
    const brandBit = row.brand ? ` · ${escapeHtml(row.brand)}` : '';
    div.innerHTML = `
      <div class="hist-main">
        <div class="hist-title">#${escapeHtml(row.invoice_no || '—')} · ${escapeHtml(clientName)}${brandBit}</div>
        <div class="hist-sub">${escapeHtml(row.invoice_date || '')} · ${escapeHtml(profName)}</div>
      </div>
      <div class="hist-right">
        <div class="hist-amt">${fmtMoney(row.total || 0, row.currency || 'USD')}</div>
        <button type="button" class="hist-del-btn" title="Delete invoice" aria-label="Delete invoice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
        </button>
      </div>
    `;
    div.addEventListener('click', () => loadInvoiceIntoForm(row));
    div.querySelector('.hist-del-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteHistoryInvoice(row);
    });
    listEl.appendChild(div);
  });
}

function loadInvoiceIntoForm(row, opts){
  const silent = opts && opts.silent;
  state.invoiceId = row.id;
  state.clientId = row.client_id;
  state.invNoManuallyEdited = false;

  if(row.profile_id){
    const p = profilesCache.find(p => p.id === row.profile_id);
    if(p){
      currentProfile = p;
      document.getElementById('profileSelect').value = p.id;
      applyProfile(p);
      setSectionsOpen(false);
    }
  }

  const clientRow = row.clients;
  if(clientRow){
    const found = clientsCache.find(c => c.name === clientRow.name);
    if(found){
      document.getElementById('toName').value = found.id;
      document.getElementById('toNameCustomWrap').style.display = 'none';
      state.clientId = found.id;
    } else {
      document.getElementById('toName').value = '__new__';
      document.getElementById('toNameCustomWrap').style.display = 'block';
      document.getElementById('toNameCustom').value = clientRow.name;
      state.clientId = row.client_id || null;
    }
    document.getElementById('toNote').value = clientRow.note || '';
  } else {
    document.getElementById('toName').value = '';
    document.getElementById('toNameCustomWrap').style.display = 'none';
    document.getElementById('toNote').value = '';
    state.clientId = null;
  }
  document.getElementById('invNo').value = row.invoice_no || '';
  document.getElementById('invDate').value = row.invoice_date || '';
  setTermsValue(row.terms || '');
  document.getElementById('invBrand').value = row.brand || '';
  document.getElementById('invCurrency').value = row.currency || 'USD';
  document.getElementById('paypalFeeOption').value = row.paypal_fee_option || 'none';
  document.getElementById('signName').value = row.sign_name || '';
  document.getElementById('signDate').value = row.sign_date || '';

  items = Array.isArray(row.items) && row.items.length
    ? row.items.map(it => ({ desc: it.desc || '', amt: parseFloat(it.amt) || 0 }))
    : [{ desc:'', amt:0 }];
  renderItemRows();
  updatePreview();
  state.isDirty = false;

  document.getElementById('historyOverlay').style.display = 'none';
  if(!silent) showToast('Loaded invoice #' + (row.invoice_no || ''));
}

function pdfFileBaseName(){
  const sanitize = (s) => String(s || '').trim().replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ').trim();
  const fromPart = sanitize(val('fromName')) || 'Invoice';
  const clientFirstWord = sanitize((getClientNameValue() || '').split(/\s+/)[0]) || 'Client';
  const brandPart = sanitize(val('invBrand'));
  const nameParts = ['INVOICE', fromPart, clientFirstWord];
  if(brandPart) nameParts.push(brandPart);
  return nameParts.join(' - ');
}

      const res = await persistInvoice();
      if(res.ok) showToast('Invoice saved to history');
      else if(res.reason === 'error') showToast('Could not save to history — opening PDF anyway');
      else if(res.reason === 'cancelled') showToast('Not saved to history');
    }

    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    const prevTitle = document.title;
    const restoreTitle = () => {
      document.title = prevTitle;
      window.removeEventListener('afterprint', restoreTitle);
    };
    window.addEventListener('afterprint', restoreTitle);
    document.title = pdfFileBaseName();
    window.print();
  } catch(err){
    alert('Could not open the PDF dialog. Please try again.');
    console.error('[Invoice Studio] PDF export failed:', describeError(err));
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

/* =========================================================
   Auth gate
   ========================================================= */
function showAuthGate(){
  document.getElementById('authOverlay').style.display = 'flex';
}
function hideAuthGate(){
  document.getElementById('authOverlay').style.display = 'none';
}
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}

document.getElementById('authSignInBtn').addEventListener('click', async () => {
  const email = val('authEmail').trim();
  const password = val('authPassword');
  const btn = document.getElementById('authSignInBtn');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await supa.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = orig;
  if(error){ showAuthError(describeError(error)); return; }
  document.getElementById('authError').style.display = 'none';
  hideAuthGate();
  await bootApp();
});
document.getElementById('authPassword').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('authSignInBtn').click();
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  if(!supa) return;
  await supa.auth.signOut();
  location.reload();
});

if(supa){
  supa.auth.onAuthStateChange((event) => {
    if(event === 'SIGNED_OUT') showAuthGate();
  });
}

async function bootApp(){
  updateConnStatus();
  await loadClients();
  await loadBankingProfiles();
  await loadProfiles();
  startNewInvoice();
}

(async () => {
  if(!supa){
    document.getElementById('configBanner').style.display = 'block';
    await bootApp();
    return;
  }
  document.getElementById('signOutBtn').style.display = 'inline-block';
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    hideAuthGate();
    await bootApp();
  } else {
    showAuthGate();
  }
})();
</script>
